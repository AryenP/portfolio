<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Aryen Palkar</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav>
    <a href="../">Home</a>
    <a href="../projects/">Projects</a>
    <a href="../resume/">Resume</a>
    <a class="current" href="../contact/" aria-current="page">Contact</a>
    <a href="https://github.com/aryenp" target="_blank" rel="noopener noreferrer">GitHub</a>
  </nav>

  <main>
    <h1>Contact</h1>
    <p>
      The fastest way to reach me is email. This form opens your mail app with the
      message filled in.
    </p>

    <form action="mailto:aryen.ronenpalkar@gmail.com" method="POST" enctype="text/plain">
      <label>
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <label>
        <span>Subject</span>
        <input name="subject" required>
      </label>

      <label>
        <span>Message</span>
        <textarea name="body" rows="6" required></textarea>
      </label>

      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
